{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Product pages">
  {% if page_obj.has_previous %}<a class="button button-outline" href="{% querystring page=page_obj.previous_page_number %}">Previous</a>{% else %}<span class="pagination-disabled">Previous</span>{% endif %}
  <span aria-current="page">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="button button-outline" href="{% querystring page=page_obj.next_page_number %}">Next</a>{% else %}<span class="pagination-disabled">Next</span>{% endif %}
</nav>
{% endif %}
