{% extends 'base.html' %}
{% block title %}Sign in | CampusFriend{% endblock %}
{% block content %}
<section class="container account-section" aria-labelledby="account-title">
  <div class="account-panel">
    <h1 id="account-title">Welcome back</h1>
    <p>Sign in to your CampusFriend account.</p>
    <form method="post" action="{% url 'accounts:login' %}" class="account-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% include 'accounts/form_fields.html' %}
      <button class="button button-primary" type="submit">Sign in</button>
    </form>
    <p class="account-switch">New to CampusFriend? <a href="{% url 'accounts:signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Sign up</a></p>
    <a class="text-link" href="{% url 'store:product_list' %}">Continue shopping as a guest</a>
  </div>
</section>
{% endblock %}
